<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/png">
    <title>LRC/SUB Sync Editor - Fluent</title>
    
    <!-- Подключение внешнего файла стилей с версией для сброса кеша -->
    <link rel="stylesheet" href="style.css?ver=6">
</head>
<body>

    <div id="setup-screen">
        <h2 style="margin-top:0; font-weight: 600; color: var(--text-bright);">Синхронизация LRC/SUB</h2>
        <div class="file-group">
            <label>Аудиофайл (MP3/WAV)</label>
            <input type="file" id="file-audio" accept="audio/*">
        </div>
        <div class="file-group">
            <label>Текст субтитров (LRC/TXT)</label>
            <input type="file" id="file-lrc" accept=".lrc,.txt">
        </div>
        <button id="btn-start" class="btn-accent" style="margin-top: 1rem;" disabled>Открыть рабочую область</button>
    </div>

    <div id="main-screen">
        <div id="app-container">
            <div id="workspace">
                <div id="canvas-container"><canvas id="waveform"></canvas></div>
                <div id="lrc-container"></div>
            </div>
            <div id="player-panel">
                <div class="nav-bar">
                    <span id="time-current">00:00.00</span>
                    <input type="range" id="progress-bar" min="0" max="100" step="0.01" value="0">
                    <span id="time-total">00:00.00</span>
                </div>
                <div class="controls">
                    <div class="controls-group">
                        <button id="btn-play" class="btn-accent" style="width: 80px;">Play (S)</button>
                        <button class="btn-nav-mark" data-dir="prev">|◀ (Q)</button>
                        <button class="btn-nav-mark" data-dir="next">▶| (E)</button>
                        <button id="btn-add-text" class="btn-accent">Добавить текст</button>
                        <button class="btn-seek" data-seek="-10">-10s</button>
                        <button class="btn-seek" data-seek="-5">-5s</button>
                        <button class="btn-seek" data-seek="-2">-2s</button>
                        <button class="btn-seek" data-seek="-1">-1s (A)</button>
                        <button class="btn-seek" data-seek="1">+1s (D)</button>
                        <button class="btn-seek" data-seek="2">+2s</button>
                        <button class="btn-seek" data-seek="5">+5s</button>
                        <button class="btn-seek" data-seek="10">+10s</button>
                        <select id="playback-rate">
                            <option value="1">1.0x Speed</option>
                            <option value="0.75">0.75x Speed</option>
                            <option value="0.5">0.5x Speed</option>
                        </select>
                    </div>
                    <div class="controls-group">
                        <button id="btn-export-lrc">Скачать .LRC</button>
                        <button id="btn-export-sub">Скачать .SUB</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно ассимиляции данных -->
    <div id="modal-text" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: var(--text-bright);">Ассимиляция текста</h3>
            <textarea id="modal-textarea" rows="10" placeholder="Вставьте LRC, SUB или обычный текст. Строки без меток будут привязаны к текущему времени..."></textarea>
            <div class="modal-actions">
                <button id="modal-btn-cancel">Отмена</button>
                <button id="modal-btn-save" class="btn-accent">Внедрить</button>
            </div>
        </div>
    </div>

    <!-- Подключение внешнего файла скриптов с версией для сброса кеша -->
    <script src="script.js?ver=6"></script>
</body>
</html>
