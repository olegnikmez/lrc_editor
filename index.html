<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRC/SUB Sync Editor - Fluent</title>
    <style>
        :root {
            var(--bg): #202020;
            --surface: #2c2c2c;
            --surface-hover: #3a3a3a;
            --surface-active: #282828;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --text-sec: #cccccc;
            --accent: #60cdff;
            --accent-hover: #4cc2ff;
            --accent-active: #28a8ea;
            --waveform-bg: #1c1c1c;
            --radius-lg: 8px;
            --radius-sm: 4px;
        }

        body {
            margin: 0; padding: 0;
            background: #202020; color: var(--text);
            font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
            overflow: hidden; user-select: none;
        }

        #setup-screen {
            display: flex; flex-direction: column; gap: 1.5rem;
            width: 420px; margin: 10vh auto;
            background: var(--surface); padding: 2.5rem;
            border-radius: var(--radius-lg); border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .file-group { display: flex; flex-direction: column; gap: 0.5rem; font-size: 14px; }
        .file-group input[type="file"] {
            font-family: inherit; font-size: 13px; color: var(--text-sec);
        }
        
        button {
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); padding: 6px 16px; 
            border-radius: var(--radius-sm); cursor: pointer; 
            transition: all 0.15s ease; font-family: inherit; font-size: 14px;
        }
        button:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-hover); }
        button:active:not(:disabled) { background: var(--surface-active); transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        button.btn-accent { background: var(--accent); color: #000; border: none; font-weight: 500; }
        button.btn-accent:hover:not(:disabled) { background: var(--accent-hover); }
        button.btn-accent:active:not(:disabled) { background: var(--accent-active); }
        button.btn-nav-mark { background: rgba(96, 205, 255, 0.1); border-color: rgba(96, 205, 255, 0.3); color: var(--accent); }
        button.btn-nav-mark:hover:not(:disabled) { background: rgba(96, 205, 255, 0.2); }

        #main-screen {
            display: none; height: 100vh; width: 100vw;
            padding: 24px; box-sizing: border-box;
            flex-direction: column; align-items: center; justify-content: center;
        }

        #app-container {
            width: 100%; max-width: 1300px; height: 100%;
            display: flex; flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        #workspace {
            flex: 1; position: relative; min-height: 0; display: flex;
        }

        #canvas-container {
            width: 400px; height: 100%;
            border-right: 1px solid var(--border); 
            background: var(--waveform-bg);
            position: relative;
        }
        canvas { display: block; width: 100%; height: 100%; cursor: ns-resize; }

        #lrc-container {
            flex: 1; height: 100%; position: relative;
            overflow: hidden; pointer-events: none;
            background: rgba(30, 30, 30, 0.5);
        }

        .lrc-line {
            position: absolute; left: 0; right: 16px;
            padding: 6px 16px; font-size: 15px;
            border-top: 1px solid var(--border);
            pointer-events: auto; cursor: row-resize;
            background: var(--surface);
            border-left: 3px solid transparent;
            color: var(--text-sec);
            transition: background 0.1s;
        }
        .lrc-line:hover { background: var(--surface-hover); border-left-color: var(--accent); color: var(--text); }
        .lrc-line.dragging { background: var(--surface-active); border-left-color: var(--accent-hover); z-index: 100; color: var(--text); }

        #player-panel {
            background: rgba(44, 44, 44, 0.95);
            border-top: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: center;
            padding: 12px 24px; box-sizing: border-box; gap: 12px;
        }

        .nav-bar { display: flex; align-items: center; gap: 16px; font-variant-numeric: tabular-nums; font-size: 13px; }
        input[type="range"] {
            flex: 1; height: 4px; border-radius: 2px;
            background: rgba(255, 255, 255, 0.2); outline: none;
            -webkit-appearance: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: var(--accent);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
        .controls-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        select {
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border); padding: 4px 8px;
            border-radius: var(--radius-sm); outline: none; font-family: inherit; font-size: 13px;
        }
        select:hover { border-color: var(--border-hover); }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2 style="margin-top:0; font-weight: 600;">Синхронизация LRC/SUB</h2>
        <div class="file-group">
            <label>Аудиофайл (MP3/WAV)</label>
            <input type="file" id="file-audio" accept="audio/*">
        </div>
        <div class="file-group">
            <label>Текст субтитров (LRC/TXT)</label>
            <input type="file" id="file-lrc" accept=".lrc,.txt">
        </div>
        <button id="btn-start" class="btn-accent" style="margin-top: 1rem;" disabled>Открыть рабочую область</button>
    </div>

    <div id="main-screen">
        <div id="app-container">
            <div id="workspace">
                <div id="canvas-container"><canvas id="waveform"></canvas></div>
                <div id="lrc-container"></div>
            </div>
            <div id="player-panel">
                <div class="nav-bar">
                    <span id="time-current">00:00.00</span>
                    <input type="range" id="progress-bar" min="0" max="100" step="0.01" value="0">
                    <span id="time-total">00:00.00</span>
                </div>
                <div class="controls">
                    <div class="controls-group">
                        <button id="btn-play" class="btn-accent" style="width: 80px;">Play (S)</button>
                        <button class="btn-nav-mark" data-dir="prev">|◀ (Q)</button>
                        <button class="btn-nav-mark" data-dir="next">▶| (E)</button>
                        <button class="btn-seek" data-seek="-10">-10s</button>
                        <button class="btn-seek" data-seek="-5">-5s</button>
                        <button class="btn-seek" data-seek="-2">-2s</button>
                        <button class="btn-seek" data-seek="-1">-1s (A)</button>
                        <button class="btn-seek" data-seek="1">+1s (D)</button>
                        <button class="btn-seek" data-seek="2">+2s</button>
                        <button class="btn-seek" data-seek="5">+5s</button>
                        <button class="btn-seek" data-seek="10">+10s</button>
                        <select id="playback-rate">
                            <option value="1">1.0x Speed</option>
                            <option value="0.75">0.75x Speed</option>
                            <option value="0.5">0.5x Speed</option>
                        </select>
                    </div>
                    <div class="controls-group">
                        <button id="btn-export-lrc">Скачать .LRC</button>
                        <button id="btn-export-sub">Скачать .SUB</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class LrcSyncApp {
            constructor() {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.buffer = null;
                this.source = null;
                this.lrcData = [];
                
                this.centerTime = 0;
                this.zoom = 150; 
                this.dragState = null;
                
                this.isPlaying = false;
                this.lastRafTime = 0;
                this.playbackRate = 1.0;
                this.animFrameId = null;

                this.ui = {
                    setup: document.getElementById('setup-screen'),
                    main: document.getElementById('main-screen'),
                    canvas: document.getElementById('waveform'),
                    lrcContainer: document.getElementById('lrc-container'),
                    btnStart: document.getElementById('btn-start'),
                    
                    btnPlay: document.getElementById('btn-play'),
                    btnExportLrc: document.getElementById('btn-export-lrc'),
                    btnExportSub: document.getElementById('btn-export-sub'),
                    progressBar: document.getElementById('progress-bar'),
                    timeCurrent: document.getElementById('time-current'),
                    timeTotal: document.getElementById('time-total'),
                    rateSelect: document.getElementById('playback-rate')
                };

                this.ctx = this.ui.canvas.getContext('2d', { alpha: false });
                this.initSetupEvents();
            }

            initSetupEvents() {
                const checkReady = () => {
                    this.ui.btnStart.disabled = !(this.buffer && this.lrcData.length > 0);
                };

                document.getElementById('file-audio').addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.buffer = await this.audioCtx.decodeAudioData(await file.arrayBuffer());
                    checkReady();
                });

                document.getElementById('file-lrc').addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.parseLRC(await file.text());
                    checkReady();
                });

                this.ui.btnStart.addEventListener('click', () => {
                    if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                    this.startEditor();
                });
            }

            initWorkspaceEvents() {
                this.ui.main.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (e.shiftKey) {
                        const factor = e.deltaY > 0 ? 0.9 : 1.1;
                        this.zoom = Math.max(10, Math.min(this.zoom * factor, 3000));
                        if (!this.isPlaying) this.render();
                    } else {
                        const delta = e.deltaY / this.zoom;
                        this.seek(this.centerTime + delta);
                    }
                }, { passive: false });

                this.ui.lrcContainer.addEventListener('mousedown', (e) => {
                    const lineEl = e.target.closest('.lrc-line');
                    if (!lineEl) return;
                    const index = parseInt(lineEl.dataset.index, 10);
                    this.dragState = { index, el: lineEl };
                    lineEl.classList.add('dragging');
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.dragState) return;
                    const rect = this.ui.canvas.getBoundingClientRect();
                    const y = e.clientY - rect.top;
                    this.lrcData[this.dragState.index].time = Math.max(0, this.centerTime + (y - rect.height / 2) / this.zoom);
                    if (!this.isPlaying) this.render();
                });

                window.addEventListener('mouseup', () => {
                    if (this.dragState) {
                        this.dragState.el.classList.remove('dragging');
                        this.dragState = null;
                    }
                });

                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                    if (!this.isPlaying) this.render();
                });

                this.ui.btnPlay.addEventListener('click', () => this.togglePlay());
                
                document.querySelectorAll('.btn-seek').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.seek(this.centerTime + parseFloat(e.target.dataset.seek));
                    });
                });

                document.querySelectorAll('.btn-nav-mark').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.seekToMark(e.target.dataset.dir);
                    });
                });

                this.ui.progressBar.addEventListener('input', (e) => {
                    this.seek(parseFloat(e.target.value));
                });

                this.ui.rateSelect.addEventListener('change', (e) => {
                    this.playbackRate = parseFloat(e.target.value);
                    if (this.source) this.source.playbackRate.value = this.playbackRate;
                });

                this.ui.btnExportLrc.addEventListener('click', () => this.export('lrc'));
                this.ui.btnExportSub.addEventListener('click', () => this.export('sub'));

                window.addEventListener('keydown', (e) => {
                    if (this.ui.main.style.display !== 'flex') return;
                    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;

                    switch (e.code) {
                        case 'Space':
                        case 'KeyW':
                        case 'KeyS':
                            e.preventDefault();
                            this.togglePlay();
                            break;
                        case 'KeyA':
                            e.preventDefault();
                            this.seek(this.centerTime - 1);
                            break;
                        case 'KeyD':
                            e.preventDefault();
                            this.seek(this.centerTime + 1);
                            break;
                        case 'KeyQ':
                            e.preventDefault();
                            this.seekToMark('prev');
                            break;
                        case 'KeyE':
                            e.preventDefault();
                            this.seekToMark('next');
                            break;
                    }
                });
            }

            parseLRC(text) {
                const lines = text.split('\n');
                const regex = /\[(\d{2}):(\d{2}(?:\.\d+)?)]\s*(.*)/;
                this.lrcData = [];
                let fallbackTime = 0;

                lines.forEach((line) => {
                    if (!line.trim()) return;
                    const match = line.match(regex);
                    if (match) {
                        const time = parseInt(match[1], 10) * 60 + parseFloat(match[2]);
                        this.lrcData.push({ time, text: match[3].trim() });
                        fallbackTime = time + 2; 
                    } else {
                        this.lrcData.push({ time: fallbackTime, text: line.trim() });
                        fallbackTime += 2;
                    }
                });
            }

            startEditor() {
                this.ui.setup.style.display = 'none';
                this.ui.main.style.display = 'flex';
                
                this.ui.progressBar.max = this.buffer.duration;
                this.ui.timeTotal.textContent = this.formatTime(this.buffer.duration);
                
                this.ui.lrcContainer.innerHTML = '';
                this.lrcData.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'lrc-line';
                    div.dataset.index = index;
                    div.textContent = item.text || '[Пустая строка]';
                    item.el = div;
                    this.ui.lrcContainer.appendChild(div);
                });

                this.resizeCanvas();
                this.initWorkspaceEvents();
                this.render();
            }

            togglePlay() { this.isPlaying ? this.pause() : this.play(); }

            play() {
                if (this.isPlaying || this.centerTime >= this.buffer.duration) return;
                
                this.source = this.audioCtx.createBufferSource();
                this.source.buffer = this.buffer;
                this.source.playbackRate.value = this.playbackRate;
                this.source.connect(this.audioCtx.destination);
                
                this.source.start(0, this.centerTime);
                this.isPlaying = true;
                this.ui.btnPlay.textContent = 'Pause (S)';
                
                this.lastRafTime = this.audioCtx.currentTime;
                this.renderLoop();
            }

            pause() {
                if (!this.isPlaying) return;
                this.source.stop();
                this.source.disconnect();
                this.source = null;
                this.isPlaying = false;
                this.ui.btnPlay.textContent = 'Play (S)';
                if (this.animFrameId) cancelAnimationFrame(this.animFrameId);
                this.render();
            }

            seek(time) {
                const wasPlaying = this.isPlaying;
                if (wasPlaying) this.pause();
                this.centerTime = Math.max(0, Math.min(time, this.buffer.duration));
                this.updateTimelineUI();
                if (wasPlaying) this.play();
                else this.render();
            }

            seekToMark(direction) {
                if (!this.lrcData.length) return;
                
                const sorted = [...this.lrcData].sort((a, b) => a.time - b.time);
                let targetTime = this.centerTime;
                const epsilon = 0.05; // 50ms tolerance

                if (direction === 'prev') {
                    for (let i = sorted.length - 1; i >= 0; i--) {
                        if (sorted[i].time < this.centerTime - epsilon) {
                            targetTime = sorted[i].time;
                            break;
                        }
                    }
                    if (targetTime === this.centerTime) targetTime = 0;
                } else if (direction === 'next') {
                    for (let i = 0; i < sorted.length; i++) {
                        if (sorted[i].time > this.centerTime + epsilon) {
                            targetTime = sorted[i].time;
                            break;
                        }
                    }
                }
                
                this.seek(targetTime);
            }

            renderLoop() {
                if (!this.isPlaying) return;
                const now = this.audioCtx.currentTime;
                const delta = (now - this.lastRafTime) * this.playbackRate;
                this.lastRafTime = now;
                
                this.centerTime += delta;
                if (this.centerTime >= this.buffer.duration) {
                    this.centerTime = this.buffer.duration;
                    this.pause();
                }

                this.render();
                this.animFrameId = requestAnimationFrame(() => this.renderLoop());
            }

            resizeCanvas() {
                const rect = this.ui.canvas.parentElement.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                this.ui.canvas.width = rect.width * dpr;
                this.ui.canvas.height = rect.height * dpr;
                this.ctx.scale(dpr, dpr);
                this.canvasLogicalWidth = rect.width;
                this.canvasLogicalHeight = rect.height;
            }

            render() {
                this.renderWaveform();
                this.updateLrcDOM();
                this.updateTimelineUI();
            }

            renderWaveform() {
                const width = this.canvasLogicalWidth;
                const height = this.canvasLogicalHeight;
                const halfW = width / 2;
                const halfH = height / 2;

                this.ctx.fillStyle = '#1c1c1c';
                this.ctx.fillRect(0, 0, width, height);
                if (!this.buffer) return;

                const data = this.buffer.getChannelData(0);
                const sampleRate = this.buffer.sampleRate;
                
                const startTime = this.centerTime - halfH / this.zoom;
                const endTime = this.centerTime + halfH / this.zoom;

                const startSample = Math.max(0, Math.floor(startTime * sampleRate));
                const endSample = Math.min(data.length, Math.ceil(endTime * sampleRate));
                const step = Math.max(1, Math.ceil((endSample - startSample) / height));

                this.ctx.beginPath();
                this.ctx.strokeStyle = '#60cdff';
                this.ctx.lineWidth = 1;

                for (let y = 0; y < height; y++) {
                    const t = this.centerTime + (y - halfH) / this.zoom;
                    const idx = Math.floor(t * sampleRate);

                    if (idx >= 0 && idx < data.length) {
                        let min = 0, max = 0;
                        for (let i = 0; i < step && (idx + i) < data.length; i++) {
                            const val = data[idx + i];
                            if (val < min) min = val;
                            if (val > max) max = val;
                        }
                        this.ctx.moveTo(halfW + min * halfW * 0.9, y);
                        this.ctx.lineTo(halfW + max * halfW * 0.9, y);
                    }
                }
                this.ctx.stroke();

                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                this.ctx.setLineDash([4, 4]);
                this.ctx.beginPath();
                this.lrcData.forEach(item => {
                    const y = halfH + (item.time - this.centerTime) * this.zoom;
                    if (y >= 0 && y <= height) {
                        this.ctx.moveTo(halfW, y);
                        this.ctx.lineTo(width, y);
                    }
                });
                this.ctx.stroke();
                this.ctx.setLineDash([]);

                this.ctx.strokeStyle = '#ffffff';
                this.ctx.lineWidth = 1.5;
                this.ctx.beginPath();
                this.ctx.moveTo(0, halfH);
                this.ctx.lineTo(width, halfH);
                this.ctx.stroke();
            }

            updateLrcDOM() {
                const halfH = this.canvasLogicalHeight / 2;
                this.lrcData.forEach(item => {
                    const y = halfH + (item.time - this.centerTime) * this.zoom;
                    item.el.style.transform = `translateY(${y - 14}px)`;
                    
                    if (y < -100 || y > this.canvasLogicalHeight + 100) {
                        if (item.el.style.display !== 'none') item.el.style.display = 'none';
                    } else {
                        if (item.el.style.display === 'none') item.el.style.display = 'block';
                    }
                });
            }

            updateTimelineUI() {
                if (document.activeElement !== this.ui.progressBar) {
                    this.ui.progressBar.value = this.centerTime;
                }
                this.ui.timeCurrent.textContent = this.formatTime(this.centerTime);
            }

            formatTime(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = Math.floor(seconds % 60).toString().padStart(2, '0');
                const ms = Math.floor((seconds % 1) * 100).toString().padStart(2, '0');
                return `${m}:${s}.${ms}`;
            }

            formatTimeFull(seconds) {
                const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                const s = Math.floor(seconds % 60).toString().padStart(2, '0');
                const ms = Math.floor((seconds % 1) * 100).toString().padStart(2, '0');
                return `${h}:${m}:${s}.${ms}`;
            }

            export(format) {
                const sorted = [...this.lrcData].sort((a, b) => a.time - b.time);
                let content = "";
                let filename = "";

                if (format === 'lrc') {
                    content = sorted.map(item => `[${this.formatTime(item.time)}]${item.text}`).join('\n');
                    filename = 'synced.lrc';
                } else if (format === 'sub') {
                    for (let i = 0; i < sorted.length; i++) {
                        const item = sorted[i];
                        const nextItem = sorted[i + 1];
                        const startTime = this.formatTimeFull(item.time);
                        const endTime = nextItem ? this.formatTimeFull(nextItem.time) : this.formatTimeFull(item.time + 2);
                        content += `${startTime},${endTime}\n${item.text}\n\n`;
                    }
                    filename = 'synced.sub';
                }

                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }
        }

        document.addEventListener('DOMContentLoaded', () => new LrcSyncApp());
    </script>
</body>
</html>
